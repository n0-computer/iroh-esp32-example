<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>iroh wasm GUI</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="./main.js" type="module"></script>
  </head>
  <body>
    <main>
      <h1>iroh in the browser</h1>
      <p class="subtitle">
        An iroh endpoint compiled from Rust to WebAssembly. Connectivity is
        relay-only (browsers have no UDP/QUIC sockets), so it talks to the
        relay-capable ESP32 (PSRAM) variants.
      </p>

      <div class="card">
        <label>Your endpoint ID <span class="hint">(stable — stored in this browser)</span></label>
        <code id="endpoint-id" class="endpoint-id">—</code>
        <button id="reset-identity" type="button" class="link">roll a new identity</button>
      </div>

      <div class="card">
        <label for="ticket">Echo server ticket</label>
        <input
          id="ticket"
          type="text"
          placeholder="endpoint… ticket from a relay-capable (PSRAM) ESP32"
          autocomplete="off"
        />
        <label for="payload">Message</label>
        <input id="payload" type="text" value="Hello from the browser!" autocomplete="off" />
        <button id="connect" type="button" disabled>send echo</button>
        <output id="result" class="result"></output>
      </div>

      <p class="status" id="status">loading wasm…</p>
    </main>
  </body>
</html>
