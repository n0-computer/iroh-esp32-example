[package]
name = "esp32-echo-client"
version = "0.1.0"
edition = "2021"

# Vanilla iroh from crates.io — proves the ESP32 server works with stock iroh

[dependencies]
iroh = "0.96.1"
iroh-tickets = "0.3.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
